<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demos</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f0e6;
        --surface: rgba(255, 255, 255, 0.84);
        --text: #111827;
        --muted: #5b6472;
        --accent: #8c3f2c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, rgba(140, 63, 44, 0.12), transparent 32%), var(--bg);
        color: var(--text);
        font: 400 18px/1.6 Georgia, serif;
      }
      main {
        width: min(42rem, calc(100vw - 2rem));
        padding: 2rem;
        border-radius: 24px;
        border: 1px solid rgba(17, 24, 39, 0.12);
        background: var(--surface);
        box-shadow: 0 24px 60px rgba(17, 24, 39, 0.08);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 1.2rem + 2vw, 3rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo projects</h1>
      <p>Static serverless demos will be published here.</p>
      <p><a href="/">Back to the blog</a></p>
    </main>
  </body>
</html>
